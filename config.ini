# Reaper Batch Converter 配置文件
#
# 重要提示：
# 1. 路径中不要包含空格！REAPER 批处理模式无法处理带空格的路径
# 2. 不要使用引号包裹路径
# 3. Windows 路径可以使用正斜杠 / 或反斜杠 \
# 4. 推荐使用绝对路径

[Paths]
# REAPER 可执行文件路径（不要有空格！）
# 示例：C:/Program Files/REAPER (x64)/reaper.exe（这个路径有空格，会出问题！）
# 推荐：安装 REAPER 到无空格路径，如 C:/REAPER/reaper.exe
reaper_exe = C:/Program Files/REAPER (x64)/reaper.exe

# FX Chain 预设文件存放目录（不要有空格！）
# 示例：D:/ReaperPresets
presets_dir = D:/02.Projects_Files/Otoful_PluginPresets/Reaper_Presets

[Options]
# 是否在替换前备份原文件（true/false）
backup_before_replace = false

# 备份目录名称
backup_dir = .backup

# 默认输出文件后缀（如果预设文件中未指定 OUTPATTERN）
default_output_suffix = -converted
